<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Express - SVG Animation</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17222d;
      --muted-ink: #496171;
      --paper: #f4fbfc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 255, 255, 0.9) 0 5%, transparent 25%),
        linear-gradient(145deg, #e8f8fb 0%, #d9f0f4 50%, #c8e5eb 100%);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .page {
      width: min(100%, 1280px);
      padding: clamp(12px, 3vw, 34px);
    }

    .scene-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(23, 34, 45, 0.16);
      border-radius: 18px;
      background: var(--paper);
      box-shadow:
        0 24px 70px rgba(44, 92, 106, 0.22),
        0 3px 8px rgba(24, 47, 58, 0.1);
    }

    .scene {
      display: block;
      width: 100%;
      height: auto;
    }

    .hud {
      position: absolute;
      top: clamp(14px, 2.5vw, 28px);
      left: clamp(14px, 2.8vw, 32px);
      right: clamp(14px, 2.8vw, 32px);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .title-lockup {
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.76);
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--muted-ink);
      font-size: clamp(10px, 1.1vw, 13px);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(22px, 3.6vw, 44px);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .motion-toggle {
      display: inline-grid;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(23, 34, 45, 0.16);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink);
      box-shadow: 0 5px 16px rgba(31, 71, 82, 0.12);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 160ms ease, background 160ms ease;
    }

    .motion-toggle:hover {
      transform: translateY(-2px);
      background: #ffffff;
    }

    .motion-toggle:focus-visible {
      outline: 3px solid rgba(25, 137, 153, 0.4);
      outline-offset: 3px;
    }

    .motion-toggle svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .motion-toggle .play-icon {
      display: none;
    }

    .motion-toggle.is-paused .pause-icon {
      display: none;
    }

    .motion-toggle.is-paused .play-icon {
      display: block;
    }

    .scene.is-paused .motion-layer,
    .scene.is-paused .cloud,
    .scene.is-paused .wing {
      animation-play-state: paused;
    }

    .scene.is-paused .motion-layer {
      opacity: 0.9;
    }

    .caption {
      position: absolute;
      right: clamp(14px, 2.8vw, 32px);
      bottom: clamp(12px, 2.4vw, 28px);
      margin: 0;
      color: rgba(23, 34, 45, 0.62);
      font-size: clamp(9px, 1vw, 12px);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .cloud {
      animation: cloudDrift 18s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }

    .cloud.slow {
      animation-duration: 26s;
      animation-delay: -8s;
    }

    .cloud.fast {
      animation-duration: 15s;
      animation-delay: -5s;
    }

    .wing {
      transform-box: view-box;
      transform-origin: 565px 300px;
      animation: wingFlap 1.45s ease-in-out infinite;
    }

    .wing.back {
      animation-delay: -0.24s;
      animation-duration: 1.62s;
      transform-origin: 594px 300px;
    }

    .motion-layer {
      animation: gentleBob 1.18s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 590px 450px;
    }

    .road-shimmer {
      animation: roadShimmer 3.6s linear infinite;
    }

    .water-wave {
      animation: waveSlide 4.8s linear infinite;
    }

    .water-wave.delayed {
      animation-delay: -2.2s;
    }

    @keyframes cloudDrift {
      from { transform: translateX(-10px); }
      to { transform: translateX(18px); }
    }

    @keyframes wingFlap {
      0%, 100% { transform: rotate(-3deg) scaleY(0.985); }
      50% { transform: rotate(5deg) scaleY(1.025); }
    }

    @keyframes gentleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes roadShimmer {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -120; }
    }

    @keyframes waveSlide {
      from { transform: translateX(0); }
      to { transform: translateX(-180px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud,
      .wing,
      .motion-layer,
      .road-shimmer,
      .water-wave {
        animation-play-state: paused;
      }
    }
  </style>
</head>

  <script>
    (() => {
      const scene = document.getElementById('pelicanScene');
      const toggle = document.getElementById('motionToggle');
      const rearSpokes = document.getElementById('rearSpokes');
      const frontSpokes = document.getElementById('frontSpokes');
      const crank = document.getElementById('crank');
      const legFar = document.getElementById('legFar');

      const footNear = document.getElementById('footNear');

      const rearWheel = { x: 380, y: 500 };
      const frontWheel = { x: 810, y: 500 };
      const crankCenter = { x: 602, y: 500 };
      const hipFar = { x: 555, y: 414 };
      const hipNear = { x: 590, y: 417 };
      const pedalRadius = 44;
      const frameRate = 0.16;
      let rotation = 0;
      let lastTime = 0;
      let paused = false;

      const pointOnCircle = (angle, radius = pedalRadius) => ({
        x: crankCenter.x + Math.cos(angle) * radius,
        y: crankCenter.y + Math.sin(angle) * radius
      });

      const setPath = (element, start, end, bend) => {
        const midX = (start.x + end.x) / 2 + bend.x;
        const midY = (start.y + end.y) / 2 + bend.y;
        element.setAttribute('d', `M${start.x.toFixed(1)} ${start.y.toFixed(1)} Q${midX.toFixed(1)} ${midY.toFixed(1)} ${end.x.toFixed(1)} ${end.y.toFixed(1)}`);
      };

      const updateMotion = (time) => {
        if (!lastTime) lastTime = time;
        const delta = Math.min(time - lastTime, 40);
        lastTime = time;
        if (!paused) {
          rotation = (rotation + delta * frameRate) % 360;

          rearSpokes.setAttribute('transform', `rotate(${rotation.toFixed(2)} ${rearWheel.x} ${rearWheel.y})`);
          frontSpokes.setAttribute('transform', `rotate(${rotation.toFixed(2)} ${frontWheel.x} ${frontWheel.y})`);
          crank.setAttribute('transform', `rotate(${rotation.toFixed(2)} ${crankCenter.x} ${crankCenter.y})`);

          const nearPedal = pointOnCircle((rotation - 90) * Math.PI / 180);
          const farPedal = pointOnCircle((rotation + 90) * Math.PI / 180);
          setPath(legNear, hipNear, nearPedal, { x: 7, y: -7 });
          setPath(legFar, hipFar, farPedal, { x: -12, y: 8 });
          setPath(footNear, { x: nearPedal.x - 12, y: nearPedal.y }, nearPedal, { x: 0, y: 2 });
          setPath(footFar, { x: farPedal.x - 12, y: farPedal.y }, farPedal, { x: 0, y: 2 });
        }
        window.requestAnimationFrame(updateMotion);
      };

      toggle.addEventListener('click', () => {
        paused = !paused;
        scene.classList.toggle('is-paused', paused);
        toggle.classList.toggle('is-paused', paused);
        toggle.setAttribute('aria-pressed', String(paused));
        toggle.setAttribute('aria-label', paused ? 'Resume animation' : 'Pause animation');
        lastTime = 0;
      });

      window.requestAnimationFrame(updateMotion);
    })();
  </script>
</body>
</html>
