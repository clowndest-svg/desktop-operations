# ===========================================================================
# JARVIS built-in default configuration (shipped inside the package).
#
# DO NOT edit this file to customise JARVIS. Instead, create a user override
# file at:
#     %LOCALAPPDATA%\Jarvis\config\config.yaml   (or $JARVIS_HOME/config/)
# or point the JARVIS_CONFIG environment variable at any YAML file.
# You only need to write the keys you want to change.
#
# Every key can also be overridden per-run via environment variables:
#     JARVIS_<SECTION>__<KEY>=value      (double underscore = nesting)
# e.g. JARVIS_LOGGING__LEVEL=DEBUG
#
# Precedence (low -> high): this file -> user file -> environment variables.
# ===========================================================================

app:
  # Runtime profile: development | production
  environment: production
  # UI / prompt language tag
  language: zh-CN

logging:
  # DEBUG | INFO | WARNING | ERROR | CRITICAL
  level: INFO
  # Mirror logs to the console
  console: true
  # Write rotating log files under <data>/logs (phase 4)
  file_enabled: true
  # Rotate after this many bytes (10 MiB)
  max_bytes: 10485760
  # Number of rotated files to keep
  backup_count: 5
  # Level applied to third-party (non-jarvis) loggers, to suppress noise
  third_party_level: WARNING

llm:
  # Which entry under `providers` to use by default. Switch providers by
  # overriding just this key, e.g. JARVIS_LLM__DEFAULT_PROVIDER=kimi
  default_provider: deepseek
  # Per-request HTTP timeout (seconds)
  timeout_seconds: 60
  # Extra attempts on retryable failures: 429 / 5xx / timeout / network
  max_retries: 2
  # Base delay for exponential backoff (seconds); attempt N waits base * 2^(N-1)
  retry_backoff_seconds: 0.5
  # Any OpenAI-compatible endpoint works. Adding a vendor is a pure YAML
  # edit — no code change. API keys are NEVER written here: `api_key_env`
  # names the environment variable that holds the key.
  # cost_*_per_1m are USD prices per 1M tokens, used only for cost logging
  # (0 disables cost reporting).
  providers:
    deepseek:
      base_url: https://api.deepseek.com/v1
      model: deepseek-chat
      api_key_env: DEEPSEEK_API_KEY
      cost_input_per_1m: 0.0
      cost_output_per_1m: 0.0
    openai:
      base_url: https://api.openai.com/v1
      model: gpt-4o-mini
      api_key_env: OPENAI_API_KEY
      cost_input_per_1m: 0.0
      cost_output_per_1m: 0.0
    kimi:
      base_url: https://api.moonshot.cn/v1
      model: moonshot-v1-8k
      api_key_env: MOONSHOT_API_KEY
      cost_input_per_1m: 0.0
      cost_output_per_1m: 0.0
    qwen:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-plus
      api_key_env: DASHSCOPE_API_KEY
      cost_input_per_1m: 0.0
      cost_output_per_1m: 0.0

wakeword:
  # Grabbing the microphone is an explicit opt-in; enable with
  # JARVIS_WAKEWORD__ENABLED=true or in your user config file.
  # Requires the optional voice dependencies: pip install jarvis-assistant[voice]
  enabled: false
  # asr (default) | openwakeword (offline, key-free, English only)
  # | porcupine (needs AccessKey)
  #
  # `asr` matches a keyword inside each transcribed utterance. It is the default
  # because this assistant's wake phrase is Chinese, and because it needs no model
  # file to train — but it borrows the recognition model the orchestrator already
  # loads, so it only does anything with orchestration.enabled=true.
  # Switch to openwakeword for an English "Hey Jarvis" on a lighter install.
  engine: asr
  # Keywords for the engine above. With `asr` these are plain phrases, matched
  # after stripping punctuation/spacing and lowercasing.
  #
  # The four variants below are a measurement, not a guess: on this machine
  # "你好小夜" was transcribed as "你好小叶" in 6/6 recordings across voices and
  # speeds. Exact-matching the intended spelling alone woke 0 times out of 2;
  # with the variants it woke 6/6. Add a variant when a real mishearing repeats —
  # do not invent plausible ones.
  keywords:
    - 你好小夜
    - 你好小叶
    - 你好晓叶
    - 你好小业
  # Detector-side confidence threshold [0..1] (ignored by porcupine, which
  # thresholds internally via `sensitivity` below). With engine=asr a hit is
  # binary (score 1.0), so any value below 1.0 fires.
  threshold: 0.5
  # Suppress further wake events for this long after a hit (seconds)
  cooldown_seconds: 2.0
  porcupine:
    # Environment variable holding the Picovoice AccessKey (never the key itself)
    access_key_env: PICOVOICE_ACCESS_KEY
    # Per-keyword sensitivity [0..1]; higher = more hits, more false alarms
    sensitivity: 0.5

vad:
  # Run streaming speech endpointing (utterance start/end) AFTER a wake word
  # fires, to slice the command out of the mic stream for ASR. Off by default;
  # enable with JARVIS_VAD__ENABLED=true.
  # Requires the optional voice dependencies: pip install jarvis-assistant[voice]
  enabled: false
  # silero (offline, ONNX, the only engine for now)
  engine: silero
  # Speech-probability gate [0..1]; frames at/above are considered speech.
  threshold: 0.5
  # Ignore utterances shorter than this (ms) — drops clicks / breath blips
  # before any speech-start event is emitted.
  min_speech_ms: 250
  # End the utterance after this much continuous silence (ms).
  max_silence_ms: 500
  # Pad added around the detected speech (ms) so ASR gets clean edges.
  speech_pad_ms: 100
  # Hard cap on a single utterance (ms); 0 = no cap (long speech auto-segments).
  max_speech_ms: 0

asr:
  # Speech recognition (offline SenseVoice / FunASR). Off by default; enabling
  # loads a model, so turn it on with JARVIS_ASR__ENABLED=true only when you
  # actually want voice input. Requires: pip install jarvis-assistant[voice]
  enabled: false
  # sensevoice (offline, ONNX, the only engine for now)
  engine: sensevoice
  # SenseVoiceSmall on ModelScope — auto-downloaded on first inference.
  model: iic/SenseVoiceSmall
  # auto = detect language; or force a tag like zh / en / ja / ko / yue
  language: auto
  # Decoding temperature [0..1]; 0 = greedy (most stable).
  temperature: 0.0
  # Beam-search width (>= 1); 1 = greedy (fastest).
  beam_size: 5
  # Inference device: cpu | cuda
  device: cpu
  # Restore punctuation with the ct-punc model. Off by default: it is a second,
  # ~850 MB model downloaded on top of SenseVoice, and the transcripts are
  # readable without it.
  punctuation: false

tts:
  # Speech synthesis (CosyVoice offline / Edge-TTS cloud). Off by default;
  # enabling loads a model or opens a cloud session, so turn it on with
  # JARVIS_TTS__ENABLED=true only when you actually want spoken replies.
  # Requires: pip install jarvis-assistant[voice]
  enabled: false
  # cosyvoice (offline, ONNX) | edge_tts (cloud, pure-Python).
  # ``voice`` is engine-specific — the two ids below must move together.
  # edge_tts ships as a clean wheel and works out of the box; cosyvoice does
  # not (it needs a manual ModelScope + git-clone install), so it is opt-in.
  engine: edge_tts
  # Engine-specific voice / speaker id:
  #   cosyvoice -> e.g. 中文女 / 中文男 / 英文女 / 英文男 / 日语男
  #   edge_tts  -> e.g. zh-CN-XiaoxiaoNeural / en-US-AriaNeural
  voice: zh-CN-XiaoxiaoNeural
  # Playback speed multiplier (1.0 = normal); 0 = as fast as possible.
  speed: 1.0
  # Output gain in [0, 1]; 1.0 = full volume.
  volume: 1.0
  # Inference device for the offline engine: cpu | cuda
  device: cpu
  # Offline model id / path (CosyVoice2 on ModelScope, auto-downloaded).
  model: iic/CosyVoice2-0.5B

orchestration:
  # End-to-end voice pipeline: wake-word -> VAD -> ASR -> multi-agent -> TTS.
  # Off by default. When enabled, also set asr.enabled=true and tts.enabled=true
  # (the orchestrator drives them); the standalone wakeword/vad loops are
  # superseded. Enable with JARVIS_ORCHESTRATION__ENABLED=true.
  enabled: false
  # Let the user interrupt a spoken reply by talking over it (Barge-In).
  barge_in: true
  # Agent the supervisor falls back to when intent is unclear.
  default_agent: chat
